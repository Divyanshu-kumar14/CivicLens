# requirements.lock — index of the pinned dependency sets.
#
# This file is documentation, not a pip requirements file: pip cannot parse
# the [vision]/[agent] sections. The installable locks are:
#
#   vision/requirements.lock   -> installed by infra/Dockerfile.vision
#   agent/requirements.lock    -> installed by infra/Dockerfile.agent
#   web/package-lock.json      -> installed by infra/Dockerfile.web (npm ci)
#
# The two Dockerfiles install their lock file, not the requirements.txt range.
# requirements.txt is kept only for local dev (`make install`).
#
# Frozen 2026-10-10 from the built images (python:3.11-slim, OpenCV 5).
