server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Human override needs the admin bearer token. Inject it server-side from
    # the web container's ADMIN_SECRET so the secret never reaches the browser
    # bundle. This regex must precede the general API location below.
    location ~ ^/tickets/[^/]+/override$ {
        proxy_pass http://agent-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "Bearer ${ADMIN_SECRET}";
    }

    # API -> agent service (compose network DNS)
    location ~ ^/(jobs|tickets|export\.csv|webhooks|health) {
        proxy_pass http://agent-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Route videos ride this proxy: nginx defaults to a 1MB body cap
        # (every real upload died with 413) and 60s proxy timeouts.
        client_max_body_size 2048m;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
